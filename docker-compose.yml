services:

  # -----------------------------------------------------------------
  # 2. Redis
  # -----------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: project_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    networks:
      - project_network

networks:
  project_network:
    driver: bridge
